# Include inside the same HTTPS virtual host as CASHIER_SERVICE_URL.
# A static route keeps APK delivery outside Node and its database pool.
location ^~ /kingclub-updates/cashier/ {
    alias /var/www/kingclub-updates/cashier/;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
